<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Skibidi Toilet Clicker</title>
<style>
  :root{
    --bg:#0f1724;
    --card:#0b1320;
    --accent:#72f5c2;
    --muted:#9aa7b2;
    --glass: rgba(255,255,255,0.03);
    --glass-2: rgba(255,255,255,0.02);
    --glass-3: rgba(255,255,255,0.015);
  }
  *{box-sizing:border-box;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial}
  html,body{height:100%;margin:0;background:linear-gradient(180deg,#071021 0%, #081628 60%);color:#e6f0f2}
  .wrap{max-width:1100px;margin:28px auto;padding:20px;display:grid;grid-template-columns: 1fr 380px;gap:18px}
  header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
  header h1{margin:0;font-size:20px;letter-spacing:0.4px}
  header .meta{color:var(--muted);font-size:13px}
  .main{
    background:linear-gradient(180deg, var(--card), rgba(7,20,30,0.9));
    border-radius:12px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.02);
  }
  .toilet-wrap{display:flex;align-items:center;flex-direction:column;gap:12px}
  .score{
    text-align:center;
  }
  .score .big{font-size:36px;font-weight:700}
  .score .small{color:var(--muted);font-size:13px}
  .toilet{
    width:260px;height:260px;border-radius:26px;background:linear-gradient(180deg,#ecf7f1,#dffdf2);
    display:grid;place-items:center;cursor:pointer;user-select:none;position:relative;
    box-shadow: 0 12px 35px rgba(2,8,12,0.6), 0 3px 0 rgba(0,0,0,0.25) inset;
    transition:transform 120ms cubic-bezier(.2,.9,.25,1);
  }
  .toilet:active{transform:scale(.97)}
  /* Toilet face details (SVG inside) */
  .toilet .spark{position:absolute;right:12px;top:12px;color:#54c09f;font-size:14px}
  .controls{display:flex;gap:8px;align-items:center}
  .btn{background:var(--glass);border:1px solid rgba(255,255,255,0.03);padding:8px 12px;border-radius:10px;color:var(--muted);cursor:pointer;font-size:13px}
  .btn.primary{background:linear-gradient(90deg,#12c6a6,#3bd9b0);color:#01221b;border:none; font-weight:700}
  .rightcol{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;padding:16px; height:fit-content;box-shadow:0 6px 18px rgba(0,0,0,0.5)}
  .panel-title{font-weight:700;margin-bottom:8px}
  .stat{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:6px}
  .store{display:grid;gap:10px;max-height:60vh;overflow:auto;padding-right:6px}
  .card{background:linear-gradient(180deg,var(--glass),var(--glass-2));padding:10px;border-radius:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid rgba(255,255,255,0.02)}
  .card .left{display:flex;gap:10px;align-items:center}
  .icon{width:52px;height:52px;border-radius:8px;background:linear-gradient(180deg,#ffffff,#e6f6ef);display:grid;place-items:center;color:#08332a;font-weight:800}
  .card h4{margin:0;font-size:15px}
  .card p{margin:0;color:var(--muted);font-size:12px}
  .buy{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .cost{font-weight:700}
  .owned{color:var(--muted);font-size:12px}
  footer{grid-column:1/-1;margin-top:6px;color:var(--muted);font-size:12px;text-align:center}
  /* click particles */
  .particle{position:absolute;pointer-events:none;font-weight:800;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.5));}
  /* responsive */
  @media(max-width:980px){.wrap{grid-template-columns:1fr;}.rightcol{order:99}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>Skibidi Toilet Clicker 🚽</h1>
    <div class="meta">Click the toilet. Buy upgrades. Become legendary.</div>
  </header>

  <section class="main">
    <div class="toilet-wrap">
      <div class="score" aria-live="polite">
        <div class="big" id="score">0</div>
        <div class="small">Skibidi Flushes • <span id="cps">0</span> / sec</div>
      </div>

      <div id="toilet" class="toilet" title="Click me!">
        <!-- Simple stylized toilet using inline SVG for consistent look -->
        <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset="1" stop-color="#e3fcec"/>
            </linearGradient>
            <linearGradient id="g2" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#dfeef0"/>
              <stop offset="1" stop-color="#b7d7cf"/>
            </linearGradient>
          </defs>
          <!-- bowl -->
          <ellipse cx="100" cy="130" rx="58" ry="34" fill="url(#g2)" />
          <rect x="50" y="30" rx="18" ry="18" width="100" height="64" fill="url(#g1)"/>
          <!-- lid -->
          <rect x="64" y="20" rx="10" ry="10" width="72" height="16" fill="#f6fffb" />
          <!-- face - eyes and mouth to make it cute -->
          <circle cx="75" cy="60" r="6" fill="#0a2a23"/>
          <circle cx="125" cy="60" r="6" fill="#0a2a23"/>
          <path d="M78 78 Q100 92 122 78" stroke="#063827" stroke-width="4" stroke-linecap="round" fill="none" />
          <!-- water swirls -->
          <g id="swirls" opacity="0.8">
            <path d="M86 140 C88 132,112 132,114 140" stroke="#a7f0e0" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M95 150 C97 144,103 144,105 150" stroke="#dffcf6" stroke-width="2" fill="none" stroke-linecap="round"/>
          </g>
        </svg>
      </div>

      <div class="controls">
        <button class="btn" id="reset">Reset</button>
        <button class="btn" id="export">Export Save</button>
        <button class="btn" id="importBtn">Import Save</button>
        <input id="importText" placeholder="paste save here" style="display:none;width:1px;height:1px;border:0;padding:0;margin:0" />
      </div>

    </div>
    <div style="width:100%;margin-top:6px;color:var(--muted);font-size:13px;text-align:center">
      Tip: press the toilet quickly for combo particles!
    </div>
  </section>

  <aside class="rightcol">
    <div class="panel">
      <div class="panel-title">Stats</div>
      <div class="stat"><div>Skibidi Flushes</div><div id="stat-score">0</div></div>
      <div class="stat"><div>Flushes / second</div><div id="stat-cps">0</div></div>
      <div class="stat"><div>All-time earned</div><div id="stat-total">0</div></div>
      <hr style="border:none;border-top:1px solid rgba(255,255,255,0.02);margin:8px 0" />
      <div class="panel-title">Store</div>
      <div class="store" id="store"></div>
    </div>
  </aside>

  <footer>
    Made with love and porcelain. Auto-saves every 10s. Local only.
  </footer>
</div>

<script>
/* ---------- Game data ---------- */
const BUILDINGS = [
  { id:'plunger', name:'Plunger', baseCost:15, cps:0.1, desc:'A faithful plunger that slightly improves flow.' },
  { id:'porta', name:'Porta-Potty', baseCost:120, cps:1, desc:'Mobile, smelly, but effective.' },
  { id:'flushvalve', name:'Flush Valve', baseCost:700, cps:8, desc:'Industrial valve for mega flushes.' },
  { id:'choir', name:'Skibidi Choir', baseCost:4500, cps:47, desc:'They sing and the toilets flush in chorus.' },
  { id:'factory', name:'Toilet Factory', baseCost:30000, cps:260, desc:'Mass-produced toilets produce mass-produced flushes.' }
];

const SAVE_KEY = 'skibidi_save_v1';

/* ---------- Utility ---------- */
function fmt(n){
  if (n < 1000) return (+n.toFixed(2)).toString();
  const units = ['K','M','B','T','Qa','Qi'];
  let u = 0;
  let v = n;
  while (v >= 1000 && u < units.length-1){ v /= 1000; u++; }
  return v.toFixed(v >= 100 ? 0 : v >= 10 ? 1 : 2) + units[u-1];
}

/* ---------- Game state ---------- */
let state = {
  score: 0,
  totalEarned: 0,
  buildings: {}, // id -> amount
  lastTick: Date.now(),
  clicks: 0
};

// init buildings counts
BUILDINGS.forEach(b => state.buildings[b.id] = 0);

/* ---------- DOM refs ---------- */
const dom = {
  score: document.getElementById('score'),
  cps: document.getElementById('cps'),
  statScore: document.getElementById('stat-score'),
  statCps: document.getElementById('stat-cps'),
  statTotal: document.getElementById('stat-total'),
  store: document.getElementById('store'),
  toilet: document.getElementById('toilet'),
  resetBtn: document.getElementById('reset'),
  exportBtn: document.getElementById('export'),
  importBtn: document.getElementById('importBtn'),
  importText: document.getElementById('importText')
};

/* ---------- Game logic ---------- */
function getBuildingCost(base, owned){
  // exponential growth slightly scaled
  return Math.floor(base * Math.pow(1.15, owned));
}

function computeCPS(){
  let cps = 0;
  BUILDINGS.forEach(b => {
    cps += b.cps * (state.buildings[b.id] || 0);
  });
  return cps;
}

function addScore(amount){
  if (!isFinite(amount) || amount <= 0) return;
  state.score += amount;
  state.totalEarned += amount;
  updateDisplay();
}

/* ---------- UI store rendering ---------- */
function renderStore(){
  dom.store.innerHTML = '';
  BUILDINGS.forEach(b => {
    const owned = state.buildings[b.id] || 0;
    const cost = getBuildingCost(b.baseCost, owned);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="left">
        <div class="icon">${b.name.slice(0,2).toUpperCase()}</div>
        <div>
          <h4>${b.name}</h4>
          <p>${b.desc}</p>
        </div>
      </div>
      <div class="buy">
        <div class="cost">${fmt(cost)}</div>
        <div class="owned">${owned} owned • ${fmt(b.cps)}/s each</div>
        <button class="btn primary buy-btn" data-id="${b.id}" style="margin-top:6px">Buy</button>
      </div>
    `;
    dom.store.appendChild(card);
    card.querySelector('.buy-btn').onclick = () => {
      buyBuilding(b.id);
    };
  });
}

/* ---------- Buying ---------- */
function buyBuilding(id){
  const b = BUILDINGS.find(x => x.id === id);
  const owned = state.buildings[id] || 0;
  const cost = getBuildingCost(b.baseCost, owned);
  if (state.score >= cost){
    state.score -= cost;
    state.buildings[id] = owned + 1;
    updateDisplay();
    renderStore();
    spawnParticle('+1', Math.random()*200+50, 0, '#72f5c2');
  } else {
    // small shake animation or feedback
    flashColor('#ff6b6b');
  }
}

/* ---------- Click handling ---------- */
function onToiletClick(ev){
  const now = Date.now();
  const delta = Math.max(1, Math.round(1 + Math.random()*2)); // base per click
  addScore(delta);
  state.clicks++;
  spawnParticle('+'+delta, ev.clientX, ev.clientY);
  animateSplash();
  beep(Math.min(800 + state.clicks*10, 1500), 0.05);
}

/* ---------- Visuals: particle, splash ---------- */
function spawnParticle(text, clientX, clientY, color){
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = text;
  p.style.left = (clientX - (appLeft())) + 'px';
  p.style.top = (clientY - (appTop())) + 'px';
  p.style.color = color || '#a9fff0';
  p.style.transform = 'translate(-50%, -50%)';
  document.body.appendChild(p);
  const anim = p.animate([
    { transform:'translate(-50%,-50%) scale(1)', opacity:1 },
    { transform:'translate(-50%,-160%) scale(0.6)', opacity:0 }
  ], {duration:900, easing:'cubic-bezier(.2,.7,0,1)'});
  anim.onfinish = ()=>p.remove();
}

function appLeft(){ return document.getElementById('app').getBoundingClientRect().left; }
function appTop(){ return document.getElementById('app').getBoundingClientRect().top; }

let splashTimeout = null;
function animateSplash(){
  const toilet = dom.toilet;
  if (splashTimeout) clearTimeout(splashTimeout);
  toilet.style.transform = 'scale(0.98) translateY(-6px)';
  splashTimeout = setTimeout(()=> toilet.style.transform = '', 120);
}

function flashColor(color='#ff6b6b'){
  const app = document.getElementById('app');
  const old = app.style.boxShadow;
  app.style.boxShadow = `0 0 0 4px ${hexToRgba(color,0.12)}`;
  setTimeout(()=> app.style.boxShadow = old, 220);
}
function hexToRgba(hex, a=1){
  hex = hex.replace('#','');
  if (hex.length===3) hex = hex.split('').map(x=>x+x).join('');
  const r = parseInt(hex.slice(0,2),16);
  const g = parseInt(hex.slice(2,4),16);
  const b = parseInt(hex.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ---------- Game loop & autosave ---------- */
function tick(){
  const now = Date.now();
  const elapsed = (now - state.lastTick)/1000;
  state.lastTick = now;
  const cps = computeCPS();
  const gain = cps * elapsed;
  if (gain > 0) addScore(gain);
  updateDisplay();
}

function updateDisplay(){
  const cps = computeCPS();
  dom.score.textContent = fmt(state.score);
  dom.cps.textContent = fmt(cps);
  dom.statScore.textContent = fmt(state.score);
  dom.statCps.textContent = fmt(cps);
  dom.statTotal.textContent = fmt(state.totalEarned);
}

/* ---------- Save / Load ---------- */
function save(){
  try {
    const toSave = {
      score: state.score,
      totalEarned: state.totalEarned,
      buildings: state.buildings,
      lastTick: Date.now()
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(toSave));
  } catch(e){ console.warn('Save failed', e); }
}

function load(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.score != null) state.score = data.score;
    if (data.totalEarned != null) state.totalEarned = data.totalEarned;
    if (data.buildings) state.buildings = data.buildings;
    state.lastTick = Date.now();
  } catch(e){ console.warn('Load failed', e); }
}

/* ---------- Reset / Export / Import ---------- */
function resetGame(){
  if (!confirm('Reset your save? This cannot be undone.')) return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

function exportSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY) || JSON.stringify({
      score:0, totalEarned:0, buildings: state.buildings
    });
    navigator.clipboard.writeText(raw).then(()=> alert('Save copied to clipboard!'));
  } catch(e){ alert('Export failed'); }
}

function importSave(){
  const txt = prompt('Paste full save JSON here:');
  if (!txt) return;
  try {
    const data = JSON.parse(txt);
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    alert('Imported! Reloading...');
    location.reload();
  } catch(e){ alert('Import failed: invalid JSON'); }
}

/* ---------- Sound (tiny beep) ---------- */
let audioCtx = null;
function beep(freq=800, duration=0.08){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.value = 0.06;
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    setTimeout(()=>{ o.stop(); }, duration*1000+30);
  } catch(e){ /* ignore if blocked */ }
}

/* ---------- Init ---------- */
(function init(){
  load();
  renderStore();
  updateDisplay();

  // click
  dom.toilet.addEventListener('click', (ev)=> onToiletClick(ev));
  dom.resetBtn.onclick = resetGame;
  dom.exportBtn.onclick = exportSave;
  dom.importBtn.onclick = importSave;

  // game loop - tick every 1s but calculate elapsed for smoothness
  state.lastTick = Date.now();
  setInterval(tick, 1000);

  // autosave
  setInterval(save, 10000);

  // minor particle on load
  spawnParticle('Skibidi!', appLeft()+120, appTop()+60, '#72f5c2');
})();

/* ---------- keyboard quick boost (fun) ---------- */
document.addEventListener('keydown', (e)=>{
  if (e.key === ' '){
    // spacebar to click quickly
    const rect = dom.toilet.getBoundingClientRect();
    onToiletClick({clientX: rect.left + rect.width/2, clientY: rect.top + rect.height/2});
    e.preventDefault();
  }
});
</script>
</body>
</html>
